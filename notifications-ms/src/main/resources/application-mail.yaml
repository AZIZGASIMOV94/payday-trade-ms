spring:
  mail:
    host: "smtp.gmail.com"
    port: 587
    username: &mail ${MAIL_USERNAME:}
    # set MAIL_USERNAME (Gmail address)
    password: ${MAIL_PASSWORD:}
    # set MAIL_PASSWORD (Gmail app password)
    properties.mail.smtp:
      auth: true
      starttls.enable: true
    protocol: "smtp"