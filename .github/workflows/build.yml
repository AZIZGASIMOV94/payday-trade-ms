name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      # Compiles all modules (main + test sources) and runs the web-layer tests,
      # which don't need a running MySQL instance.
      - name: Compile all modules
        run: ./gradlew assemble testClasses --no-daemon

      - name: Run controller tests
        run: ./gradlew :deposit-cash-ms:test :list-stock-ms:test --tests '*ControllerTest' --no-daemon
